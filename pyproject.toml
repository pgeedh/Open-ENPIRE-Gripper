[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-enpire-gripper-nvidia"
version = "1.0.0"
description = "Multi-Robot Arm 3D Printable STL Model Ecosystem for the ENPIRE Gripper"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "Open-ENPIRE-Gripper-NVIDIA Community"}
]
keywords = ["robotics", "gripper", "enpire", "nvidia-gear", "3d-printing", "stl", "physical-ai"]
dependencies = [
    "numpy>=1.22.0",
]

[project.urls]
Homepage = "https://github.com/pgeedh/Open-ENPIRE-Gripper-nvidia"
Documentation = "https://github.com/pgeedh/Open-ENPIRE-Gripper-nvidia/tree/main/docs"
Repository = "https://github.com/pgeedh/Open-ENPIRE-Gripper-nvidia"
