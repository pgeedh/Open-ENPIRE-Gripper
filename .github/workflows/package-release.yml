name: Build & Package Release STL Bundles

on:
  release:
    types: [ created ]
  workflow_dispatch:

jobs:
  bundle-stls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package STL Collections
        run: |
          mkdir -p release_bundles
          zip -r release_bundles/enpire_stls_all_robots.zip stl/
          zip -r release_bundles/enpire_yam_baseline.zip stl/enpire_i2rt_yam/
          zip -r release_bundles/enpire_piper_adapters.zip stl/agilex_piper/
          zip -r release_bundles/enpire_robotiq_adapters.zip stl/robotiq_2f85_2f140/
          zip -r release_bundles/enpire_franka_adapters.zip stl/franka_panda/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_bundles/*.zip
