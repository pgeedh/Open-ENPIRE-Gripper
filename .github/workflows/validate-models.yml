name: Validate 3D Models & URDFs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-stl-and-urdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Regenerate and verify STLs
        run: |
          python3 scripts/generate_stls.py
          python3 scripts/validate_mesh.py

      - name: Export and validate URDFs
        run: |
          python3 scripts/export_urdf.py
